<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrul actelor permisive · EVO</title>
  <link rel="stylesheet" href="../assets/fonts/Onest.css">
  <link rel="stylesheet" href="../css/main.css?v=crumbs-v2">
  <link rel="stylesheet" href="../css/button-icons.css?v=button-icons-v1">
  <link rel="stylesheet" href="../css/skeleton.css?v=skeleton-v1">
  <link rel="stylesheet" href="../css/empty-state.css?v=empty-v3">
  <link rel="stylesheet" href="../css/facet-filter.css?v=filter-chip-v1">
  <link rel="stylesheet" href="../css/bo-profile-parts.css?v=audit-fix-v5">
  <link rel="stylesheet" href="../css/doc-modal-parts.css?v=act-doc-v1">
  <link rel="stylesheet" href="../css/doc-preview.css?v=doc-viewer-v2">
  <link rel="stylesheet" href="../css/act-view.css?v=button-icons-v1">
  <link rel="stylesheet" href="rap-evo.css?v=audit-fix-v5">
  <link rel="stylesheet" href="../css/dropdown.css?v=dd-item-v1">
  <link rel="stylesheet" href="../css/copy-value.css?v=copy-wrap-v1">
  <link rel="stylesheet" href="../css/breadcrumbs.css?v=breadcrumb-v1">
  <link rel="stylesheet" href="../css/pager.css?v=audit-fix-v3">
  <link rel="stylesheet" href="../css/tag.css?v=audit-fix-v5">
  <link rel="stylesheet" href="../css/field-sizes.css?v=audit-fix-v1">
  <link rel="stylesheet" href="../css/modal-phone.css?v=sheet-header-v1">
  <link rel="stylesheet" href="../css/page-reveal.css?v=skeleton-v1">
  <!-- ?state=<id> opens the screen a Figma frame shows (js/demo-states.js) -->
  <script src="../js/demo-states.js?v=svc10x4-v1"></script>
  <script src="../js/demo-links.js?v=links-v4"></script>
  <script src="../js/toast.js?v=toast-v2" defer></script>
  <script src="../js/tag.js?v=audit-fix-v5"></script>
  <script src="../js/pager.js?v=audit-fix-v3"></script>
  <script src="../js/copy-value.js?v=copy-wrap-v1"></script>
  <script src="../js/icon-tooltip.js?v=tooltip-one-v1" defer></script>
  <script src="../js/breadcrumbs.js?v=tooltip-one-v1"></script>
  <script src="../js/empty-state.js?v=empty-v3" defer></script>
  <script src="../js/facet-filter.js?v=filter-chip-v1" defer></script>
  <script src="../js/doc-preview.js?v=doc-viewer-v1" defer></script>
  <script src="../js/act-view.js?v=audit-fix-v5" defer></script>
  <script src="rap-evo.js?v=audit-fix-v5" defer></script>
  <script src="../js/page-reveal.js?v=skeleton-v1" defer></script>
</head>
<body class="rap-page">
  <header class="rap-header">
    <div class="rap-header__top">
      <div class="rap-header__container">
        <a class="rap-header__government" href="../index.html" aria-label="Înapoi la selectorul demo">
          <img src="../assets/logos/government-logo.png" alt="">
          <span>Guvernul Republicii Moldova</span>
        </a>
        <nav class="rap-header__languages" aria-label="Selectează limba">
          <button class="is-active" type="button" lang="ro">Ro</button>
          <button type="button" lang="ru">Ru</button>
          <button type="button" lang="en">En</button>
        </nav>
      </div>
    </div>

    <div class="rap-header__navigation">
      <div class="rap-header__container">
        <div class="rap-header__navigation-start">
          <a class="rap-header__logo" href="../index.html" aria-label="EVO">
            <img src="../assets/logos/evo-logo.svg" alt="">
          </a>
          <nav class="rap-header__menu" aria-label="Navigare principală">
            <button class="rap-header__menu-item" type="button">
              <span>Servicii</span>
              <svg class="icon" aria-hidden="true"><use href="../assets/icons/sprite.svg#icon-chevron-bottom-small"></use></svg>
            </button>
            <button class="rap-header__menu-item is-disabled" type="button" disabled>
              <span>Evenimente de viață</span>
              <svg class="icon" aria-hidden="true"><use href="../assets/icons/sprite.svg#icon-chevron-bottom-small"></use></svg>
            </button>
            <a class="rap-header__menu-item" href="#">Prestatori servicii</a>
          </nav>
        </div>

        <div class="rap-header__navigation-end">
          <div class="rap-header__actions" aria-label="Acțiuni rapide">
            <button class="rap-icon-button" type="button" aria-label="Caută">
              <svg class="icon" aria-hidden="true"><use href="../assets/icons/sprite.svg#icon-search"></use></svg>
            </button>
            <button class="rap-icon-button" type="button" aria-label="Ajutor">
              <svg class="icon" aria-hidden="true"><use href="../assets/icons/sprite.svg#icon-bubble-question"></use></svg>
            </button>
            <button class="rap-icon-button" type="button" aria-label="Aplicații">
              <svg class="icon" aria-hidden="true"><use href="../assets/icons/sprite.svg#icon-dot-grid"></use></svg>
            </button>
          </div>
          <div class="rap-header__buttons">
            <button class="btn btn-primary btn-pill rap-header__button" type="button">Intră în cabinet</button>
            <button class="btn btn-secondary btn-pill rap-header__button" type="button">Obține semnătura</button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main class="rap-main" data-rap-list-view>
    <div class="rap-main__container">
      <!-- the trail: the ONE breadcrumb renderer (../js/breadcrumbs.js, drawn by rap-evo.js) -->
      <div class="rap-breadcrumbs" data-rap-list-crumbs></div>

      <section class="rap-intro" aria-labelledby="rap-title">
        <h1 id="rap-title" data-rap-title>Registrul actelor permisive</h1>
      </section>

      <div class="rap-toolbar">
        <div class="search-input medium rectangular rap-search">
          <span class="icon-search" aria-hidden="true">
            <svg class="icon"><use href="../assets/icons/sprite.svg#icon-search"></use></svg>
          </span>
          <input
            class="input"
            type="search"
            autocomplete="off"
            placeholder="Caută după nr. dosar sau denumire"
            aria-label="Caută în registru"
            data-rap-search
          >
          <div class="btn-group rap-search__actions">
            <button class="btn-icon clear rap-search__clear" type="button" aria-label="Șterge căutarea" data-rap-search-clear>
              <svg class="icon small" aria-hidden="true"><use href="../assets/icons/sprite.svg#icon-cross-small"></use></svg>
            </button>
          </div>
        </div>

        <!-- the BO advanced filter (js/facet-filter.js): button → bar of facet chips → checklist popover -->
        <button class="chip e-permits-filter-trigger e-permits-workplace__advanced" type="button" aria-expanded="false" aria-controls="rap-filters" data-rap-filter-toggle>
          <span class="chip__icon"><svg class="icon" aria-hidden="true"><use href="../assets/icons/sprite.svg#icon-filter-lines"></use></svg></span>
          <span class="chip__label">Filtru</span>
          <span class="chip__badge" aria-hidden="true" data-rap-filter-count hidden></span>
        </button>
      </div>

      <div class="e-permits-workplace__filters rap-filters" id="rap-filters" role="group" aria-label="Filtre" data-rap-filters hidden></div>

      <section class="rap-company-summary" data-rap-company-summary hidden aria-live="polite"></section>

      <section class="rap-register" aria-label="Acte permisive">
        <div class="rap-table-scroller" data-rap-table-scroller>
          <table class="rap-table">
            <colgroup>
              <col class="rap-table__col--beneficiary">
              <col class="rap-table__col--permit">
              <col class="rap-table__col--authority">
              <col class="rap-table__col--number">
              <col class="rap-table__col--date">
              <col class="rap-table__col--status">
              <col class="rap-table__col--action">
            </colgroup>
            <thead>
              <tr>
                <th scope="col">Beneficiar</th>
                <th scope="col">Denumire act</th>
                <th scope="col">Autoritate</th>
                <th scope="col">Nr. act</th>
                <th scope="col">Valabil până la</th>
                <th scope="col">Statut</th>
                <th scope="col"><span class="visually-hidden">Deschide</span></th>
              </tr>
            </thead>
            <tbody data-rap-table-body></tbody>
          </table>
        </div>

        <div class="rap-pagination" data-rap-pagination></div>
      </section>

      <div class="rap-state" data-rap-empty hidden></div>
    </div>
  </main>

  <main class="rap-profile" data-rap-profile-view hidden></main>

</body>
</html>
