<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sandbox · Solicitant / Reprezentant</title>
  <link rel="stylesheet" href="../assets/fonts/Onest.css">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="sandbox.css?v=20260821-5">
</head>
<body class="sbx">
  <aside class="sbx-panel">
    <header class="sbx-panel__head">
      <h1>Solicitant / Reprezentant</h1>
      <p>Comută condițiile din stânga; în dreapta rulează pagina reală
        <code>e-permits-acte-permisive.html</code>, cu aceleași ecrane, doar cu alte date.</p>
    </header>

    <section class="sbx-section">
      <h2 class="sbx-section__title">Scenarii compuse</h2>
      <div class="sbx-presets" data-sandbox-presets></div>
    </section>

    <section class="sbx-section">
      <h2 class="sbx-section__title">Condiții</h2>
      <div class="sbx-toggles" data-sandbox-toggles></div>
      <button type="button" class="sbx-reset" data-sandbox-reset>Resetează la implicit</button>
    </section>

    <section class="sbx-section">
      <h2 class="sbx-section__title">Schema generată</h2>
      <pre class="sbx-schema" data-sandbox-schema></pre>
    </section>
  </aside>

  <main class="sbx-stage">
    <div class="sbx-outcome" data-sandbox-outcome></div>
    <div class="sbx-frame-wrap">
      <iframe class="sbx-frame" title="Previzualizare ecran" data-sandbox-frame></iframe>
    </div>
  </main>

  <script src="sandbox.js?v=20260821-5"></script>
</body>
</html>
