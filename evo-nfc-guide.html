<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EVO · NFC guide animation</title>
<style>
  :root {
    --bg: #ffffff;
    --ring: #3d7be0;
    --bezel: #1c1d21;
    --screen: #2b2e36;
    --island: #0f0f12;
    --ok: #16a34a;
    --text: #1f1f1f;
    --muted: #6b6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: var(--bg); color: var(--text);
    font-family: Onest, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  main { display: grid; gap: 24px; justify-items: center; padding: 16px; }
  .stage {
    position: relative; width: 420px; height: 300px; overflow: hidden;
    max-width: calc(100vw - 32px);
  }
  .card {
    position: absolute; left: 60px; top: 0; width: 300px; height: 300px;
    background: url("assets/evo/id-card-front.png") center / contain no-repeat;
  }
  .ring {
    position: absolute; left: 210px; top: 117px; width: 330px; height: 330px;
    margin: -165px 0 0 -165px; border-radius: 50%;
    border: 2px solid var(--ring); opacity: 0; transform: scale(.2);
    animation: ring 6s ease-out infinite;
  }
  .ring:nth-child(3) { animation-delay: .25s; }
  .ring:nth-child(4) { animation-delay: .5s; }
  .phone {
    position: absolute; left: 108px; top: 39px; width: 198px; height: 408px;
    background: var(--bezel); border-radius: 36px; padding: 6px;
    transform: translateY(300px) rotate(8deg); transform-origin: 50% 0;
    animation: phone 6s cubic-bezier(.45, 0, .2, 1) infinite;
    box-shadow: 0 16px 32px rgba(11, 16, 32, .18);
  }
  .screen {
    position: relative; width: 100%; height: 100%;
    background: var(--screen); border-radius: 30px;
  }
  .island {
    position: absolute; left: 50%; top: 10px; width: 57px; height: 16px;
    margin-left: -28.5px; border-radius: 8px; background: var(--island);
  }
  .badge {
    position: absolute; left: 280px; top: 18px; width: 48px; height: 48px;
    border-radius: 50%; background: var(--ok); display: grid; place-items: center;
    opacity: 0; transform: scale(.4);
    animation: badge 6s ease-out infinite; box-shadow: 0 6px 16px rgba(22, 163, 74, .35);
  }
  .badge svg { width: 24px; height: 24px; }
  .caption { margin: 0; font-size: 16px; line-height: 24px; color: var(--muted); text-align: center; }
  .caption strong { color: var(--text); font-weight: 600; }

  @keyframes phone {
    0%, 14%  { transform: translateY(300px) rotate(8deg); }
    32%, 86% { transform: translateY(0) rotate(8deg); }
    100%     { transform: translateY(300px) rotate(8deg); }
  }
  @keyframes ring {
    0%, 34%  { opacity: 0; transform: scale(.2); }
    40%      { opacity: .9; }
    58%      { opacity: 0; transform: scale(1); }
    100%     { opacity: 0; transform: scale(1); }
  }
  @keyframes badge {
    0%, 66%  { opacity: 0; transform: scale(.4); }
    72%      { opacity: 1; transform: scale(1.08); }
    76%, 86% { opacity: 1; transform: scale(1); }
    94%,100% { opacity: 0; transform: scale(.4); }
  }
  /* Reduce motion: one still frame (phone on the card), text guidance stays */
  @media (prefers-reduced-motion: reduce) {
    .phone, .ring, .badge { animation: none; }
    .phone { transform: translateY(0) rotate(8deg); }
  }
</style>
</head>
<body>
<main>
  <div class="stage" role="img" aria-label="A phone moves onto the ID card; the top of the phone's back touches the card and the card is read over NFC.">
    <div class="card"></div>
    <div class="ring"></div>
    <div class="ring"></div>
    <div class="ring"></div>
    <div class="phone"><div class="screen"><div class="island"></div></div></div>
    <div class="badge"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
  </div>
  <p class="caption"><strong>Hold your ID card to the top of your iPhone's back</strong><br>Keep it flat and still until it's read.</p>
</main>
</body>
</html>
