<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EVO · NFC guide animation</title>
<style>
  :root {
    --bg: #ffffff;
    --ring: #3d7be0;
    --bezel: #1c1d21;
    --screen: #2b2e36;
    --island: #0f0f12;
    --ok: #16a34a;
    --text: #1f1f1f;
    --muted: #6b6b6b;
    --navy: #1e3a8a;
    --red: #c8283c;
    --T: 6s;
    --approach: cubic-bezier(.16, 1, .3, 1);   /* fast start, soft landing */
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: var(--bg); color: var(--text);
    font-family: Onest, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  main { display: grid; gap: 24px; justify-items: center; padding: 16px; }
  .stage { position: relative; width: 420px; height: 320px; overflow: hidden; max-width: calc(100vw - 32px); }

  /* ID card — horizontal, centred (ID-1 85.6 × 54) */
  .card {
    position: absolute; left: 50%; top: 40px; width: 300px; height: 189px; margin-left: -150px;
    border-radius: 14px; overflow: hidden;
    background:
      radial-gradient(120% 80% at 85% 20%, rgba(200, 220, 255, .65), transparent 60%),
      radial-gradient(90% 90% at 10% 90%, rgba(255, 214, 228, .55), transparent 60%),
      linear-gradient(135deg, #f8f6fd, #eef3fc);
    box-shadow: 0 0 0 1px rgba(30, 58, 138, .08), 0 4px 0 #c9cfe6, 0 18px 30px rgba(30, 40, 80, .12);
  }
  .card::before {
    content: ""; position: absolute; inset: 0; opacity: .45;
    background:
      repeating-radial-gradient(circle at 70% 55%, transparent 0 14px, rgba(61, 123, 224, .18) 14px 15px),
      repeating-radial-gradient(circle at 30% 120%, transparent 0 18px, rgba(200, 40, 60, .12) 18px 19px);
  }
  .bar { position: absolute; height: 6px; border-radius: 3px; }
  .b1 { left: 16px; top: 16px; width: 82px; background: var(--navy); }
  .b2 { left: 16px; top: 27px; width: 66px; background: var(--navy); opacity: .8; }
  .b3 { left: 176px; top: 16px; width: 84px; background: var(--red); }
  .b4 { left: 176px; top: 27px; width: 68px; background: var(--red); opacity: .8; }
  .emblem { position: absolute; left: 142px; top: 14px; width: 18px; height: 18px; border-radius: 4px; background: var(--navy); transform: rotate(45deg); }
  .nfc { position: absolute; right: 14px; top: 12px; width: 20px; height: 20px; }
  .photo { position: absolute; left: 16px; top: 46px; width: 76px; height: 98px; border-radius: 8px; overflow: hidden; background: linear-gradient(#eef0f5, #d3d7e1); }
  .photo::before { content: ""; position: absolute; left: 50%; top: 14px; width: 38px; height: 38px; margin-left: -19px; border-radius: 50%; background: linear-gradient(#a7adbd, #7d8496); }
  .photo::after { content: ""; position: absolute; left: 50%; top: 50px; width: 96px; height: 80px; margin-left: -48px; border-radius: 48px 48px 0 0; background: linear-gradient(#8f96a8, #5e6578); }
  .line { position: absolute; left: 108px; height: 6px; border-radius: 3px; background: #3c4257; }
  .line.l { height: 4px; background: #a3a9b8; }
  .sig { position: absolute; left: 108px; bottom: 16px; width: 70px; height: 18px; }
  .num { position: absolute; right: 16px; bottom: 18px; width: 54px; height: 7px; border-radius: 4px; background: #3c4257; }

  /* NFC rings from the contact point */
  .ring {
    position: absolute; left: 50%; top: 134px; width: 340px; height: 340px; margin: -170px 0 0 -170px;
    border-radius: 50%; border: 2px solid var(--ring); opacity: 0; transform: scale(.15);
    animation: ring var(--T) cubic-bezier(.2, .7, .2, 1) infinite;
  }
  .ring.r2 { animation-delay: .25s; }
  .ring.r3 { animation-delay: .5s; }

  /* phone — comes towards the card from the viewer (zooms in), lands with its top over the card */
  .phone {
    position: absolute; left: 50%; top: 96px; width: 132px; height: 272px; margin-left: -66px;
    background: var(--bezel); border-radius: 26px; padding: 5px;
    transform-origin: 50% 20%;
    animation: phone var(--T) var(--approach) infinite;
  }
  .screen { position: relative; width: 100%; height: 100%; border-radius: 21px; background: var(--screen); }
  .island { position: absolute; left: 50%; top: 8px; width: 38px; height: 11px; margin-left: -19px; border-radius: 6px; background: var(--island); }

  .badge {
    position: absolute; left: 50%; top: 14px; width: 44px; height: 44px; margin-left: 52px;
    border-radius: 50%; background: var(--ok); display: grid; place-items: center;
    opacity: 0; transform: scale(.4); box-shadow: 0 8px 18px rgba(22, 163, 74, .35);
    animation: badge var(--T) cubic-bezier(.34, 1.56, .64, 1) infinite;
  }
  .badge svg { width: 22px; height: 22px; }
  .caption { margin: 0; font-size: 16px; line-height: 24px; color: var(--muted); text-align: center; }
  .caption strong { color: var(--text); font-weight: 600; }

  /* 6 s: card alone → phone approaches from the viewer (big + soft → normal) → rings → check → phone leaves towards the viewer */
  @keyframes phone {
    0%, 12%  { opacity: 0; transform: scale(2.2); filter: blur(6px); box-shadow: 0 40px 60px rgba(11, 16, 32, .0); }
    18%      { opacity: 1; }
    34%, 84% { opacity: 1; transform: scale(1); filter: blur(0); box-shadow: 0 14px 28px rgba(11, 16, 32, .22); }
    96%,100% { opacity: 0; transform: scale(2.2); filter: blur(6px); box-shadow: 0 40px 60px rgba(11, 16, 32, .0); }
  }
  @keyframes ring {
    0%, 36%  { opacity: 0; transform: scale(.15); }
    40%      { opacity: .85; }
    62%      { opacity: 0; transform: scale(1); }
    100%     { opacity: 0; transform: scale(1); }
  }
  @keyframes badge {
    0%, 66%  { opacity: 0; transform: scale(.4); }
    72%, 86% { opacity: 1; transform: scale(1); }
    92%,100% { opacity: 0; transform: scale(.4); }
  }
  /* Reduce motion: still frame with the phone on the card — text guidance stays */
  @media (prefers-reduced-motion: reduce) {
    .phone, .ring, .badge { animation: none; }
    .phone { box-shadow: 0 14px 28px rgba(11, 16, 32, .22); }
  }
</style>
</head>
<body>
<main>
  <div class="stage" role="img" aria-label="A phone comes towards the ID card and rests on it; the top of the phone's back touches the card and it is read over NFC.">
    <div class="card">
      <span class="bar b1"></span><span class="bar b2"></span>
      <span class="emblem"></span>
      <span class="bar b3"></span><span class="bar b4"></span>
      <svg class="nfc" viewBox="0 0 24 24" fill="none" stroke="#3d7be0" stroke-width="2" stroke-linecap="round"><path d="M8 8.5a5 5 0 0 1 0 7"/><path d="M12 6a8.5 8.5 0 0 1 0 12"/><path d="M16 3.5a12 12 0 0 1 0 17"/></svg>
      <span class="photo"></span>
      <span class="line l" style="top:50px;width:40px"></span><span class="line" style="top:58px;width:96px"></span>
      <span class="line l" style="top:74px;width:46px"></span><span class="line" style="top:82px;width:78px"></span>
      <span class="line l" style="top:98px;width:30px"></span><span class="line" style="top:106px;width:52px"></span>
      <span class="line l" style="top:122px;width:50px"></span><span class="line" style="top:130px;width:88px"></span>
      <svg class="sig" viewBox="0 0 70 18" fill="none" stroke="#1e3a8a" stroke-width="1.6" stroke-linecap="round"><path d="M2 12c6-10 9 6 14-2s6-6 9 2 6 4 10-3 7 6 12 2 9-6 21-2"/></svg>
      <span class="num"></span>
    </div>
    <div class="ring"></div><div class="ring r2"></div><div class="ring r3"></div>
    <div class="phone"><div class="screen"><div class="island"></div></div></div>
    <div class="badge"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
  </div>
  <p class="caption"><strong>Hold your ID card to the top of your iPhone's back</strong><br>Keep it flat and still until it's read.</p>
</main>
</body>
</html>
