<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EVO · NFC guide animation</title>
<style>
  :root {
    --bg: #ffffff;
    --ring: #3d7be0;
    --bezel: #1c1d21;
    --screen: #2b2e36;
    --island: #0f0f12;
    --ok: #16a34a;
    --text: #1f1f1f;
    --muted: #6b6b6b;
    --navy: #1e3a8a;
    --red: #c8283c;
    --T: 7s;                                   /* one loop */
    /* spring-ish easings (CSS linear() — smooth overshoot, no JS) */
    --spring: linear(0, .009, .035 2.1%, .141 4.4%, .723 12.9%, .938 16.7%, 1.017 20.1%, 1.043 23.5%, 1.035 27.5%, 1.008 35.4%, .996 43.4%, 1);
    --glide: cubic-bezier(.22, .9, .24, 1);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: radial-gradient(120% 90% at 50% 30%, #f4f7fd 0%, #ffffff 60%);
    color: var(--text);
    font-family: Onest, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  main { display: grid; gap: 16px; justify-items: center; padding: 16px; }

  /* ---------- 3D scene ---------- */
  .scene {
    width: 560px; height: 440px; max-width: calc(100vw - 32px);
    perspective: 1400px; perspective-origin: 50% 30%;
    display: grid; place-items: center; overflow: hidden;
  }
  .camera {                                   /* camera = slow zoom + gentle drift */
    transform-style: preserve-3d;
    animation: camera var(--T) var(--glide) infinite;
  }
  .world {                                    /* isometric plane */
    position: relative; width: 300px; height: 189px;
    transform-style: preserve-3d;
    transform: rotateX(58deg) rotateZ(-34deg);
  }

  /* ---------- ID card (ID-1, 85.6 × 54) ---------- */
  .card {
    position: absolute; inset: 0; border-radius: 14px; overflow: hidden;
    transform-style: preserve-3d;
    background:
      radial-gradient(120% 80% at 85% 20%, rgba(200, 220, 255, .65), transparent 60%),
      radial-gradient(90% 90% at 10% 90%, rgba(255, 214, 228, .55), transparent 60%),
      linear-gradient(135deg, #f8f6fd, #eef3fc);
    box-shadow: inset 0 0 0 1px rgba(30, 58, 138, .08);
    animation: card var(--T) var(--glide) infinite;
  }
  .card::before {                             /* guilloche lines */
    content: ""; position: absolute; inset: 0; opacity: .45;
    background:
      repeating-radial-gradient(circle at 70% 55%, transparent 0 14px, rgba(61, 123, 224, .18) 14px 15px),
      repeating-radial-gradient(circle at 30% 120%, transparent 0 18px, rgba(200, 40, 60, .12) 18px 19px);
  }
  .bar { position: absolute; height: 6px; border-radius: 3px; }
  .b1 { left: 16px; top: 16px; width: 82px; background: var(--navy); }
  .b2 { left: 16px; top: 27px; width: 66px; background: var(--navy); opacity: .8; }
  .b3 { left: 176px; top: 16px; width: 84px; background: var(--red); }
  .b4 { left: 176px; top: 27px; width: 68px; background: var(--red); opacity: .8; }
  .emblem { position: absolute; left: 142px; top: 14px; width: 18px; height: 18px; border-radius: 4px;
            background: var(--navy); transform: rotate(45deg); }
  .nfc { position: absolute; right: 14px; top: 12px; width: 20px; height: 20px; }
  .photo {
    position: absolute; left: 16px; top: 46px; width: 76px; height: 98px; border-radius: 8px; overflow: hidden;
    background: linear-gradient(#eef0f5, #d3d7e1);
  }
  .photo::before { content: ""; position: absolute; left: 50%; top: 14px; width: 38px; height: 38px; margin-left: -19px;
                   border-radius: 50%; background: linear-gradient(#a7adbd, #7d8496); }
  .photo::after  { content: ""; position: absolute; left: 50%; top: 50px; width: 96px; height: 80px; margin-left: -48px;
                   border-radius: 48px 48px 0 0; background: linear-gradient(#8f96a8, #5e6578); }
  .line { position: absolute; left: 108px; height: 6px; border-radius: 3px; background: #3c4257; }
  .line.l { height: 4px; background: #a3a9b8; }
  .sig { position: absolute; left: 108px; bottom: 16px; width: 70px; height: 18px; }
  .num { position: absolute; right: 16px; bottom: 18px; width: 54px; height: 7px; border-radius: 4px; background: #3c4257; }
  .edge {                                      /* card thickness */
    position: absolute; inset: 0; border-radius: 14px; background: #c9cfe6;
    transform: translateZ(-4px); animation: card var(--T) var(--glide) infinite;
  }

  /* ---------- NFC rings, on the card plane ---------- */
  .ring {
    position: absolute; left: 150px; top: 72px; width: 280px; height: 280px; margin: -140px 0 0 -140px;
    border-radius: 50%; border: 2px solid var(--ring); opacity: 0;
    transform: translateZ(1px) scale(.15);
    animation: ring var(--T) cubic-bezier(.2, .7, .2, 1) infinite;
  }
  .ring.r2 { animation-delay: .28s; }
  .ring.r3 { animation-delay: .56s; }

  /* ---------- phone shadow on the card (sharpens as it lands) ---------- */
  .shadow {
    position: absolute; left: 92px; top: -40px; width: 120px; height: 240px; border-radius: 26px;
    background: rgba(15, 20, 40, .35); filter: blur(18px); opacity: 0;
    transform: translateZ(1px) rotateZ(10deg);
    animation: shadow var(--T) var(--glide) infinite;
  }

  /* ---------- phone (lies flat, screen up, top over the card) ---------- */
  .phone {
    position: absolute; left: 92px; top: -40px; width: 120px; height: 246px;
    transform-style: preserve-3d;
    transform: translateZ(260px) rotateZ(10deg) rotateX(-10deg);
    animation: phone var(--T) var(--spring) infinite;
  }
  .phone .side { position: absolute; inset: 0; border-radius: 24px; background: #0b0c0f; transform: translateZ(-7px); }
  .phone .face {
    position: absolute; inset: 0; border-radius: 24px; background: var(--bezel); padding: 4px;
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .06);
  }
  .phone .screen {
    position: relative; width: 100%; height: 100%; border-radius: 20px; overflow: hidden;
    background: linear-gradient(160deg, #333744 0%, var(--screen) 55%, #24262d 100%);
  }
  .phone .island { position: absolute; left: 50%; top: 7px; width: 36px; height: 10px; margin-left: -18px; border-radius: 5px; background: var(--island); }
  .phone .glare {                              /* moving glare = sense of motion */
    position: absolute; inset: -40%; background: linear-gradient(115deg, transparent 40%, rgba(255, 255, 255, .10) 50%, transparent 60%);
    animation: glare var(--T) var(--glide) infinite;
  }

  /* ---------- success check ---------- */
  .badge {
    position: absolute; left: 196px; top: 8px; width: 40px; height: 40px; border-radius: 50%;
    background: var(--ok); display: grid; place-items: center; opacity: 0;
    transform: translateZ(80px) rotateZ(34deg) rotateX(-58deg) scale(.3);
    box-shadow: 0 10px 20px rgba(22, 163, 74, .35);
    animation: badge var(--T) var(--spring) infinite;
  }
  .badge svg { width: 22px; height: 22px; }

  .caption { margin: 0; font-size: 16px; line-height: 24px; color: var(--muted); text-align: center; }
  .caption strong { color: var(--text); font-weight: 600; }

  /* ---------- timeline (7 s) ----------
     0–14%   card alone, slow float
     14–34%  phone glides down onto the card (spring), camera eases in
     36–64%  NFC pulse across the card
     66–84%  check springs in
     86–100% phone lifts away, camera eases back */
  @keyframes camera {
    0%   { transform: scale(1.12) translateY(8px); }
    34%  { transform: scale(1.32) translateY(0); }
    84%  { transform: scale(1.32) translateY(0); }
    100% { transform: scale(1.12) translateY(8px); }
  }
  @keyframes card {
    0%   { transform: translateZ(0); }
    10%  { transform: translateZ(6px); }
    20%, 86% { transform: translateZ(0); }
    100% { transform: translateZ(0); }
  }
  @keyframes phone {
    0%, 12%  { transform: translateZ(300px) rotateZ(18deg) rotateX(-16deg) translateY(60px); opacity: 0; }
    16%      { opacity: 1; }
    34%, 84% { transform: translateZ(8px) rotateZ(10deg) rotateX(0deg) translateY(0); opacity: 1; }
    96%      { transform: translateZ(300px) rotateZ(18deg) rotateX(-16deg) translateY(60px); opacity: 0; }
    100%     { transform: translateZ(300px) rotateZ(18deg) rotateX(-16deg) translateY(60px); opacity: 0; }
  }
  @keyframes shadow {
    0%, 12%  { opacity: 0; filter: blur(40px); transform: translateZ(1px) rotateZ(10deg) scale(1.3); }
    34%, 84% { opacity: 1; filter: blur(10px); transform: translateZ(1px) rotateZ(10deg) scale(1); }
    96%, 100%{ opacity: 0; filter: blur(40px); transform: translateZ(1px) rotateZ(10deg) scale(1.3); }
  }
  @keyframes ring {
    0%, 36%  { opacity: 0; transform: translateZ(1px) scale(.15); }
    40%      { opacity: .85; }
    62%      { opacity: 0; transform: translateZ(1px) scale(1); }
    100%     { opacity: 0; transform: translateZ(1px) scale(1); }
  }
  @keyframes badge {
    0%, 66%  { opacity: 0; transform: translateZ(80px) rotateZ(34deg) rotateX(-58deg) scale(.3); }
    70%, 86% { opacity: 1; transform: translateZ(80px) rotateZ(34deg) rotateX(-58deg) scale(1); }
    92%,100% { opacity: 0; transform: translateZ(80px) rotateZ(34deg) rotateX(-58deg) scale(.3); }
  }
  @keyframes glare {
    0%, 14% { transform: translateX(-30%); }
    34%     { transform: translateX(30%); }
    100%    { transform: translateX(30%); }
  }

  /* Reduce motion: one still frame (phone resting on the card) — text guidance stays */
  @media (prefers-reduced-motion: reduce) {
    .camera, .card, .edge, .phone, .shadow, .ring, .badge, .glare { animation: none; }
    .phone { transform: translateZ(8px) rotateZ(10deg); }
    .shadow { opacity: 1; filter: blur(10px); }
  }
</style>
</head>
<body>
<main>
  <div class="scene" role="img" aria-label="A phone comes down onto the ID card; the top of the phone's back touches the card and it is read over NFC.">
    <div class="camera">
      <div class="world">
        <div class="edge"></div>
        <div class="card">
          <span class="bar b1"></span><span class="bar b2"></span>
          <span class="emblem"></span>
          <span class="bar b3"></span><span class="bar b4"></span>
          <svg class="nfc" viewBox="0 0 24 24" fill="none" stroke="#3d7be0" stroke-width="2" stroke-linecap="round"><path d="M8 8.5a5 5 0 0 1 0 7"/><path d="M12 6a8.5 8.5 0 0 1 0 12"/><path d="M16 3.5a12 12 0 0 1 0 17"/></svg>
          <span class="photo"></span>
          <span class="line l" style="top:50px;width:40px"></span><span class="line" style="top:58px;width:96px"></span>
          <span class="line l" style="top:74px;width:46px"></span><span class="line" style="top:82px;width:78px"></span>
          <span class="line l" style="top:98px;width:30px"></span><span class="line" style="top:106px;width:52px"></span>
          <span class="line l" style="top:122px;width:50px"></span><span class="line" style="top:130px;width:88px"></span>
          <svg class="sig" viewBox="0 0 70 18" fill="none" stroke="#1e3a8a" stroke-width="1.6" stroke-linecap="round"><path d="M2 12c6-10 9 6 14-2s6-6 9 2 6 4 10-3 7 6 12 2 9-6 21-2"/></svg>
          <span class="num"></span>
        </div>
        <div class="ring"></div><div class="ring r2"></div><div class="ring r3"></div>
        <div class="shadow"></div>
        <div class="phone">
          <div class="side"></div>
          <div class="face"><div class="screen"><div class="island"></div><div class="glare"></div></div></div>
        </div>
        <div class="badge"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
      </div>
    </div>
  </div>
  <p class="caption"><strong>Hold your ID card to the top of your iPhone's back</strong><br>Keep it flat and still until it's read.</p>
</main>
</body>
</html>
