<body class="e-permits-front-office-page is-fo-request-mode cab-page">
    <!-- the shared EVO site header (evo-header-v1, js/evo-header.js + css/evo-header.css; Figma Components 912:18991) —
         logged in (Authenticated; ?auth=0 = a visitor → Anonymous). The instance switcher panel below is moved into the
         avatar's account box by the renderer (data-evo-slot); cabinet-evo.js drives it as before. -->
    <header class="evo-header" data-evo-header data-evo-id="cab-evo-header" data-evo-auth="in" data-evo-guest-param="auth" data-evo-sticky data-evo-phone-gov="off"
            data-evo-home="?view=acte" data-evo-gov="../index.html" data-evo-cabinet="?view=catalog" data-evo-catalog="?view=catalog"
            data-evo-notifications="?view=notificari" data-evo-notifications-nav="notificari"
            data-evo-initials="AC" data-evo-user="Anastasia Cojocaru" data-evo-user-role="Persoană fizică">
      <div class="e-permits-fo-avatar-menu" id="fo-avatar-menu" data-evo-slot="account-menu" role="menu" aria-label="Profil și roluri" data-fo-avatar-dropdown hidden>
        <div class="e-permits-fo-avatar-menu__profile">
          <span class="avatar avatar--initials e-permits-fo-avatar-menu__photo e-permits-fo-avatar-menu__photo--brand" aria-hidden="true">AC</span>
          <div class="e-permits-fo-avatar-menu__identity">
            <strong>Anastasia Cojocaru</strong>
            <span>Persoană fizică</span>
          </div>
          <div class="e-permits-fo-avatar-menu__actions">
            <a class="e-permits-fo-avatar-menu__cabinet" href="#" role="menuitem">Cabinetul Personal</a>
            <!-- the EVO „Notificări” compartment (minimal stand-in: cabinet-evo/notificari.js) -->
            <a class="e-permits-fo-avatar-menu__settings" href="?view=notificari" aria-label="Notificări" role="menuitem" data-cab-nav-item="notificari">
              <svg class="icon" width="20" height="20" aria-hidden="true">
                <use href="../assets/icons/sprite.svg#icon-notification"></use>
              </svg>
            </a>
            <button class="e-permits-fo-avatar-menu__settings" type="button" aria-label="Setări" role="menuitem">
              <svg class="icon" width="20" height="20" aria-hidden="true">
                <use href="../assets/icons/sprite.svg#icon-settings"></use>
              </svg>
            </button>
          </div>
        </div>
        <div class="e-permits-fo-avatar-menu__content">
          <section class="e-permits-fo-avatar-menu__group" aria-labelledby="fo-avatar-menu-roles">
            <h2 id="fo-avatar-menu-roles">Alege alt rol</h2>
            <div class="e-permits-fo-avatar-menu__role-list">
              <button class="e-permits-fo-avatar-menu__role is-selected" type="button" role="menuitemradio" aria-checked="true" data-fo-avatar-role data-cab-as="pf-anastasia">
                <span class="avatar avatar--sm avatar--initials e-permits-fo-avatar-menu__role-avatar e-permits-fo-avatar-menu__role-avatar--initials e-permits-fo-avatar-menu__role-avatar--brand" aria-hidden="true">AC</span>
                <span class="e-permits-fo-avatar-menu__role-copy">
                  <strong>Anastasia Cojocaru</strong>
                  <span>IDNP 2990000000002</span>
                </span>
                <svg class="icon e-permits-fo-avatar-menu__role-check" width="20" height="20" aria-hidden="true">
                  <use href="../assets/icons/sprite.svg#icon-checkmark-large"></use>
                </svg>
              </button>
              <button class="e-permits-fo-avatar-menu__role" type="button" role="menuitemradio" aria-checked="false" data-fo-avatar-role data-cab-as="pj-global-trader">
                <span class="avatar avatar--sm avatar--icon e-permits-fo-avatar-menu__role-avatar" aria-hidden="true">
                  <svg class="icon" width="20" height="20">
                    <use href="../assets/icons/sprite.svg#icon-business"></use>
                  </svg>
                </span>
                <span class="e-permits-fo-avatar-menu__role-copy">
                  <strong>SRL Global Trader</strong>
                  <span>IDNO 1012600000002</span>
                </span>
                <svg class="icon e-permits-fo-avatar-menu__role-check" width="20" height="20" aria-hidden="true">
                  <use href="../assets/icons/sprite.svg#icon-checkmark-large"></use>
                </svg>
              </button>
            </div>
          </section>
          <section class="e-permits-fo-avatar-menu__group" aria-labelledby="fo-avatar-menu-proxy">
            <h2 id="fo-avatar-menu-proxy">Cu împuternicire MPower</h2>
            <button class="e-permits-fo-avatar-menu__proxy" type="button" role="menuitem" aria-expanded="false" data-fo-avatar-proxy-toggle>
              <span data-fo-avatar-proxy-label>Arată mai multe</span>
              <span class="e-permits-fo-avatar-menu__proxy-stack" aria-hidden="true">
                <span class="avatar avatar--sm avatar--initials e-permits-fo-avatar-menu__stack-avatar e-permits-fo-avatar-menu__stack-avatar--apricot">GV</span>
                <span class="avatar avatar--sm avatar--icon e-permits-fo-avatar-menu__stack-avatar">
                  <svg class="icon" width="20" height="20">
                    <use href="../assets/icons/sprite.svg#icon-business"></use>
                  </svg>
                </span>
                <span class="avatar avatar--sm avatar--initials e-permits-fo-avatar-menu__stack-avatar e-permits-fo-avatar-menu__stack-avatar--apricot">OF</span>
                <span class="avatar avatar--sm avatar--initials e-permits-fo-avatar-menu__stack-avatar e-permits-fo-avatar-menu__stack-avatar--counter">+5</span>
                <span class="e-permits-fo-avatar-menu__proxy-arrow">
                  <svg class="icon" width="20" height="20">
                    <use href="../assets/icons/sprite.svg#icon-chevron-bottom"></use>
                  </svg>
                </span>
              </span>
            </button>
            <div class="e-permits-fo-avatar-menu__proxy-details" data-fo-avatar-proxy-details>
              <button class="e-permits-fo-avatar-menu__proxy-role" type="button" role="menuitem">
                <span class="avatar avatar--sm avatar--initials e-permits-fo-avatar-menu__role-avatar e-permits-fo-avatar-menu__role-avatar--apricot" aria-hidden="true">GV</span>
                <span class="e-permits-fo-avatar-menu__proxy-role-copy">
                  <span class="e-permits-fo-avatar-menu__proxy-role-heading">
                    <strong>Grigore Vasilescu</strong>
                    <span class="e-permits-fo-avatar-menu__proxy-badge">Împuternicire</span>
                  </span>
                  <span>IDNO 1012600000001</span>
                </span>
              </button>
              <button class="e-permits-fo-avatar-menu__proxy-role" type="button" role="menuitem" data-cab-as="pj-vita-plant">
                <span class="avatar avatar--sm avatar--icon e-permits-fo-avatar-menu__role-avatar" aria-hidden="true">
                  <svg class="icon" width="20" height="20"><use href="../assets/icons/sprite.svg#icon-business"></use></svg>
                </span>
                <span class="e-permits-fo-avatar-menu__proxy-role-copy">
                  <span class="e-permits-fo-avatar-menu__proxy-role-heading">
                    <strong>«Vita-Plant» SRL</strong>
                    <span class="e-permits-fo-avatar-menu__proxy-badge">Împuternicire</span>
                  </span>
                  <span>IDNO 1012600000001</span>
                </span>
              </button>
              <button class="e-permits-fo-avatar-menu__proxy-role" type="button" role="menuitem" data-cab-as="mpower-pj-lumina">
                <span class="avatar avatar--sm avatar--icon e-permits-fo-avatar-menu__role-avatar" aria-hidden="true">
                  <svg class="icon" width="20" height="20"><use href="../assets/icons/sprite.svg#icon-business"></use></svg>
                </span>
                <span class="e-permits-fo-avatar-menu__proxy-role-copy">
                  <span class="e-permits-fo-avatar-menu__proxy-role-heading">
                    <strong>Lumina Office SRL</strong>
                    <span class="e-permits-fo-avatar-menu__proxy-badge">Împuternicire</span>
                  </span>
                  <span>IDNO 1012600000005</span>
                </span>
              </button>
              <button class="e-permits-fo-avatar-menu__proxy-role" type="button" role="menuitem">
                <span class="avatar avatar--sm avatar--icon e-permits-fo-avatar-menu__role-avatar" aria-hidden="true">
                  <svg class="icon" width="20" height="20"><use href="../assets/icons/sprite.svg#icon-business"></use></svg>
                </span>
                <span class="e-permits-fo-avatar-menu__proxy-role-copy">
                  <span class="e-permits-fo-avatar-menu__proxy-role-heading">
                    <strong>«Vita-Plant» SRL</strong>
                    <span class="e-permits-fo-avatar-menu__proxy-badge">Împuternicire</span>
                  </span>
                  <span>IDNO 1012600000001</span>
                </span>
              </button>
              <button class="e-permits-fo-avatar-menu__proxy-role" type="button" role="menuitem">
                <span class="avatar avatar--sm avatar--icon e-permits-fo-avatar-menu__role-avatar" aria-hidden="true">
                  <svg class="icon" width="20" height="20"><use href="../assets/icons/sprite.svg#icon-business"></use></svg>
                </span>
                <span class="e-permits-fo-avatar-menu__proxy-role-copy">
                  <span class="e-permits-fo-avatar-menu__proxy-role-heading">
                    <strong>«Vita-Plant» SRL</strong>
                    <span class="e-permits-fo-avatar-menu__proxy-badge">Împuternicire</span>
                  </span>
                  <span>IDNP 2990000000001</span>
                </span>
              </button>
            </div>
          </section>
        </div>
        <div class="e-permits-fo-avatar-menu__footer">
          <button class="e-permits-fo-avatar-menu__logout" type="button" role="menuitem">
            <span>Ieșire</span>
            <svg class="icon" width="20" height="20" aria-hidden="true">
              <use href="../assets/icons/sprite.svg#icon-logout"></use>
            </svg>
          </button>
        </div>
      </div>
    </header>


  <main class="cab-main">
    <div class="cab-main__container">
      <div class="cab-view" data-cab-view="acte">
      <section class="cab-intro" aria-labelledby="cab-title">
        <h1 class="text-heading-h2" id="cab-title" data-cab-title>Actele mele permisive</h1>
      </section>

      <!-- Feature 90818: an expired / revoked MPower restricts the acts completely (cabinet-evo.js) -->
      <div class="cab-restriction" data-cab-restriction hidden></div>

      <div class="cab-toolbar" data-cab-toolbar>
        <div class="search-input medium rectangular cab-search">
          <span class="icon-search" aria-hidden="true">
            <svg class="icon"><use href="../assets/icons/sprite.svg#icon-search"></use></svg>
          </span>
          <input
            class="input"
            type="search"
            autocomplete="off"
            placeholder="Caută după nr. act sau denumire"
            aria-label="Caută în actele permisive după numărul sau denumirea actului"
            data-cab-search
          >
          <div class="btn-group cab-search__actions">
            <button class="btn-icon clear cab-search__clear" type="button" aria-label="Șterge căutarea" data-cab-search-clear>
              <svg class="icon small" aria-hidden="true"><use href="../assets/icons/sprite.svg#icon-cross-small"></use></svg>
            </button>
          </div>
        </div>

        <!-- the shared facet filter (js/facet-filter.js, as RAP): button (the search height, btn-md 40) → bar of
             facet chips → popover; phones: the round „Filtre” pill (48) → the all-filters sheet -->
        <button class="chip e-permits-filter-trigger e-permits-workplace__advanced cab-filter" type="button" aria-expanded="false" aria-controls="cab-filters" data-cab-filter-toggle>
          <span class="chip__icon"><svg class="icon" aria-hidden="true"><use href="../assets/icons/sprite.svg#icon-filter-lines"></use></svg></span>
          <span class="chip__label">Filtre</span>
          <span class="chip__badge" aria-hidden="true" data-cab-filter-count hidden></span>
        </button>

        <!-- „Sortează” (acts-sort-v1) = the Solicitările mele control: the toolbar chip (as „Filtre”) → the desktop
             menu „Sortează după” / „Ordine” (js/sort-sheet.js); phones: icon-only square → the sort sheet -->
        <div class="cab-sort" data-cab-sort>
          <button type="button" class="chip e-permits-filter-trigger e-permits-sort-trigger cab-sort__trigger" aria-haspopup="menu" aria-expanded="false" aria-controls="cab-sort-menu" data-cab-menu-trigger>
            <span class="chip__icon"><svg class="icon" aria-hidden="true"><use href="../assets/icons/sprite.svg#icon-sort"></use></svg></span>
            <span class="chip__label" data-cab-sort-label>Data emiterii</span>
          </button>
          <ul class="e-permits-fo-intent-menu e-permits-stack__menu cab-menu cab-menu--wide e-permits-sort-menu" id="cab-sort-menu" role="menu" aria-label="Sortează actele permisive" hidden data-cab-sort-menu></ul>
        </div>
      </div>

      <div class="e-permits-workplace__filters cab-filters" id="cab-filters" role="group" aria-label="Filtre" data-cab-filters hidden></div>
      <p class="u-visually-hidden" aria-live="polite" data-cab-sort-status></p>

      <section class="cab-list" aria-label="Lista actelor permisive" data-cab-list></section>

      <div data-cab-pager hidden></div>

      <div class="cab-state" data-cab-empty hidden></div>
      </div>

      <!-- Solicitările mele — rendered by solicitari.js -->
      <div class="cab-view" data-cab-view="solicitari" hidden></div>

      <!-- Notificări — rendered by notificari.js -->
      <div class="cab-view" data-cab-view="notificari" hidden></div>

      <!-- Catalogul serviciilor — rendered by catalog.js -->
      <div class="cab-view" data-cab-view="catalog" hidden></div>
    </div>
  </main>
</body>
