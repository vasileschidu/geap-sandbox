<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Autentificare · SIA GEAP Back Office</title>
  <link rel="stylesheet" href="assets/fonts/Onest.css">
  <link rel="stylesheet" href="css/main.css?v=border200-v1">
  <link rel="stylesheet" href="css/token-fix.css?v=library-adopt-v4">
  <link rel="stylesheet" href="css/button-icons.css?v=button-icons-v1">
  <link rel="stylesheet" href="css/skeleton.css?v=skeleton-v1">
  <link rel="stylesheet" href="css/e-permits-acte-permisive.css?v=phone-toolbar-v3">
  <link rel="stylesheet" href="css/bo-login.css?v=bo-login-v1">
  <link rel="stylesheet" href="css/page-reveal.css?v=skeleton-v1">
  <!-- ?state=<id> opens the screen a Figma frame shows (js/demo-states.js) -->
  <script src="js/demo-states.js?v=no-continue-btn-v1"></script>
  <script src="js/demo-links.js?v=links-v4"></script>
  <script src="js/toast.js?v=toast-v3" defer></script>
  <script src="js/bo-login.js?v=bo-login-v4" defer></script>
  <script src="js/page-reveal.js?v=skeleton-v1" defer></script>
</head>
<!-- Pagina de logare în SIA GEAP (US-105 / US-110; US-107 and US-109 states).
     ?product=ekyc → EVO eKYC console (US-UI-02); ?view=processing → after the MPass return;
     ?portal=admin → Admin Portal; ?ended=logout|expired → the reason the session ended;
     ?mpass=ok&as=<activ|fara-cont> → the return from MPass; ?mpass=down → MPass unavailable. -->
<body class="e-permits-front-office-page bo-login-page">
  <div class="e-permits-fo-auth">
    <header class="e-permits-fo-auth__header">
      <div class="e-permits-fo-auth__topline">
        <div class="e-permits-fo-auth__topline-inner">
          <a href="#" class="e-permits-fo-auth__gov-link" aria-label="Guvernul Republicii Moldova">
            <img src="assets/logos/egov.svg" width="18" height="21" alt="">
            <span>Guvernul Republicii Moldova</span>
          </a>
          <nav class="e-permits-fo-auth__language" aria-label="Limbă">
            <a class="is-active" href="#" lang="ro">Ro</a>
            <a href="#" lang="ru">Ru</a>
            <a href="#" lang="en">En</a>
          </nav>
        </div>
      </div>

      <!-- no profile / „Ieșire” before authentication (US-110 AC-01) -->
      <div class="e-permits-fo-auth__brandbar">
        <div class="e-permits-fo-auth__brandbar-inner">
          <div class="e-permits-fo-auth__service-heading">
            <a href="#" class="e-permits-fo-auth__evo-logo" aria-label="SIA GEAP">
              <img src="assets/logos/evo-logo.svg" alt="">
            </a>
            <div class="e-permits-fo-auth__service-title-wrap">
              <div class="e-permits-fo-auth__service-title-row">
                <h1><span data-bo-brand>SIA GEAP</span> <span class="bo-login__product" data-bo-product>Back Office</span></h1>
              </div>
            </div>
          </div>
        </div>
      </div>
    </header>

    <main class="e-permits-fo-auth__main">
      <section class="e-permits-fo-auth__card bo-login__card" aria-labelledby="bo-login-title" aria-live="polite" data-bo-login></section>
    </main>
  </div>
</body>
</html>
