<style>
:root{
  --font:'Onest',system-ui,sans-serif;
  --brand:#0058d2;
  --ink:#121212; --ink2:#3a3a3f; --mut:#7a7a82;
  --bg:#fafafb; --panel:#ffffff; --line:#c9ced8; --hair:#ececf0;
  --evo-bg:#eaf1fd; --evo-bd:#0058d2; --evo-tx:#0846a6;
  --sur-bg:#f3eefe; --sur-bd:#7c5cdf; --sur-tx:#5b3fc4;
  --pg-bg:#ffffff;  --pg-bd:#e0e0e6; --pg-tx:#1c1c1e;
  --act-bg:#1d1d24; --act-bd:#1d1d24; --act-tx:#ffffff;

  --opn-bg:#fdecec; --opn-bd:#d9453b; --opn-tx:#b42318;

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
#root{height:100vh;display:flex;flex-direction:column;overflow:hidden}
.hd{padding:15px 22px 11px;border-bottom:1px solid var(--hair);background:var(--panel);flex:none}
.hd-top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.hd-title{font-size:17px;font-weight:600;letter-spacing:-.01em}
.hd-sub{font-size:12.5px;color:var(--mut)}
.hd-row{display:flex;align-items:center;gap:12px;margin-top:11px;flex-wrap:wrap}
.seg{display:inline-flex;background:#f1f2f5;border:1px solid var(--hair);border-radius:10px;padding:3px;flex-wrap:wrap}
.seg button{font-family:var(--font);font-size:12.3px;font-weight:500;color:var(--ink2);border:0;background:transparent;padding:7px 12px;border-radius:8px;cursor:pointer;white-space:nowrap;transition:.12s}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--panel);color:var(--brand);box-shadow:0 1px 3px rgba(0,0,0,.10),0 0 .5px rgba(0,0,0,.16);font-weight:600}
.spacer{flex:1}
.tools{display:inline-flex;align-items:center;gap:6px}
.tbtn{font-family:var(--font);font-size:12px;font-weight:500;color:var(--ink2);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer;transition:.12s}
.tbtn:hover{background:#f5f6f8;color:var(--ink)}
.tbtn.on{background:#eaf1fd;border-color:#9dc0f2;color:var(--brand)}
.zoom{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.zoom button{width:29px;height:29px;border:0;background:transparent;font-size:15px;color:var(--ink2);cursor:pointer}
.zoom button:hover{background:#f5f6f8}
.zoom .zval{min-width:42px;text-align:center;font-size:11.5px;color:var(--mut);border-left:1px solid var(--hair);border-right:1px solid var(--hair);padding:0 4px;line-height:29px}
.legend{display:flex;gap:13px;flex-wrap:wrap;margin-top:9px;align-items:center}
.lg{display:inline-flex;align-items:center;gap:6px;font-size:11.3px;color:var(--ink2)}
.lg .sw{width:12px;height:12px;border-radius:4px;border:1.5px solid}
.lgsep{width:1px;height:13px;background:var(--hair)}
.viewport{flex:1;overflow:auto;position:relative;background:radial-gradient(circle at 1px 1px, #e7e9ee 1px, transparent 0) 0 0/22px 22px}
.stage{transform-origin:0 0;will-change:transform}
.canvas{position:relative;display:inline-flex;padding:44px 90px 60px 40px;min-width:100%}
.links{position:absolute;inset:0;pointer-events:none;overflow:visible;z-index:0}
.links path{fill:none;stroke:var(--line);stroke-width:1.6}
.links path.dash{stroke-dasharray:5 4;stroke:#9aa1ae}
.links path.seq{stroke:#7c5cdf;stroke-width:2}
.subtree{display:flex;align-items:center}
.kids{display:flex;flex-direction:column;gap:11px;margin-left:52px}
.nodewrap{position:relative;z-index:1}
.chip{position:relative;display:inline-flex;flex-direction:column;gap:2px;padding:8px 12px;border-radius:11px;border:1.5px solid var(--pg-bd);background:var(--pg-bg);min-width:96px;max-width:262px;box-shadow:0 1px 2px rgba(20,20,30,.05)}
.chip .lab{font-size:12.7px;font-weight:600;line-height:1.28;letter-spacing:-.005em;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.chip .meta{font-size:10.7px;color:var(--mut);line-height:1.32;font-weight:400}
.chip .plain{font-size:11px;color:var(--ink2);line-height:1.4;font-weight:400;margin-top:4px;padding-top:5px;border-top:1px dashed #e2e2e8}
.chip.t-act .plain{color:#cfcfd8;border-top-color:#3d3d47}
.kids.seq{gap:18px}
.seqbadge{font-size:9px;font-weight:700;letter-spacing:.05em;color:#5b3fc4;background:#f3eefe;border:1px solid #c3b0f0;border-radius:4px;padding:1.5px 5px;flex:none}
.chip .prov{width:7px;height:7px;border-radius:50%;flex:none}
.chip .sf{font-size:8.5px;font-weight:700;letter-spacing:.05em;padding:1.5px 5px;border-radius:4px;border:1px solid;flex:none}
.sf-EVO{background:#eaf1fd;border-color:#9dc0f2;color:#0846a6}
.sf-CAB{background:#e4f0ff;border-color:#8fb9ef;color:#06398a}
.sf-FOD{background:#f3eefe;border-color:#c3b0f0;color:#5b3fc4}
.sf-BO{background:#e9e9ee;border-color:#c4c4cf;color:#2b2b33}
.chip.t-act .sf-BO{background:#3a3a45;border-color:#55555f;color:#dcdce3}
.chip.t-act .sf-FOD{background:#4b3f6b;border-color:#645489;color:#e0d8f5}
.chip.t-act .sf-CAB{background:#2a4570;border-color:#3d5d8f;color:#d5e3f8}
.chip.t-act .sf-EVO{background:#2a4570;border-color:#3d5d8f;color:#d5e3f8}
.dim{opacity:.22;transition:opacity .15s}
.sfbtn{font-family:var(--font);font-size:11px;font-weight:600;letter-spacing:.03em;padding:4px 9px;border-radius:7px;border:1px solid;cursor:pointer;transition:.12s}
.sfbtn.off{opacity:.5}
.chip .own{font-size:8.5px;font-weight:700;letter-spacing:.04em;padding:1.5px 4px;border-radius:4px;border:1px solid;flex:none}
.own-M{background:#eaf1fd;border-color:#a9c7f4;color:#0846a6}
.own-S{background:#f2f2f4;border-color:#dcdce1;color:#5c5c66}
.chip.t-evo{background:var(--evo-bg);border-color:var(--evo-bd)} .chip.t-evo .lab{color:var(--evo-tx)}
.chip.t-sur{background:var(--sur-bg);border-color:var(--sur-bd)} .chip.t-sur .lab{color:var(--sur-tx)}
.chip.t-pg{background:var(--pg-bg);border-color:var(--pg-bd)} .chip.t-pg .lab{color:var(--pg-tx)}
.chip.t-act{background:var(--act-bg);border-color:var(--act-bd)} .chip.t-act .lab{color:var(--act-tx)} .chip.t-act .meta{color:#b9b9c4} .chip.t-act .own-S{background:#33333d;border-color:#4a4a55;color:#d5d5dd}
.chip.t-cfg{background:var(--cfg-bg);border-color:var(--cfg-bd)} .chip.t-cfg .lab{color:var(--cfg-tx)}
.chip.t-int{background:var(--int-bg);border-color:var(--int-bd)} .chip.t-int .lab{color:var(--int-tx)}
.chip.t-opn{background:var(--opn-bg);border-color:var(--opn-bd);border-style:dashed} .chip.t-opn .lab{color:var(--opn-tx)}
.chip.root{min-width:120px;box-shadow:0 3px 10px rgba(20,20,40,.10)}
.chip.flag::after{content:'⚠';position:absolute;top:-7px;left:-7px;width:16px;height:16px;border-radius:50%;background:#fff;border:1.5px solid var(--opn-bd);color:var(--opn-bd);font-size:9px;display:flex;align-items:center;justify-content:center;z-index:4}
.tog{position:absolute;right:-11px;top:50%;transform:translateY(-50%);width:20px;height:20px;border-radius:50%;background:var(--panel);border:1.5px solid var(--line);color:var(--ink2);font-size:13px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:3;font-weight:600}
.tog:hover{border-color:var(--brand);color:var(--brand)}
.count{font-size:9.5px;color:var(--mut);position:absolute;right:-11px;top:calc(50% + 14px);transform:translateX(35%)}
.hint{font-size:11px;color:var(--mut);padding:0 22px 11px;background:var(--panel);border-bottom:1px solid var(--hair);flex:none;line-height:1.5}
.conv{display:flex;align-items:center;gap:64px}
.roleswitch{display:flex;gap:10px;margin-bottom:26px;flex-wrap:wrap;position:sticky;left:0}
.rchip{border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;background:var(--panel);cursor:pointer;transition:.12s;min-width:150px}
.rchip:hover{border-color:#9dc0f2}
.rchip.on{border-color:var(--brand);background:#eef5fe;box-shadow:0 2px 8px rgba(0,88,210,.12)}
.rchip .rlab{font-size:13px;font-weight:600;color:var(--ink);letter-spacing:-.01em}
.rchip.on .rlab{color:var(--brand)}
.rchip .rsc{font-size:10.3px;color:var(--mut);margin-top:2px;font-family:ui-monospace,monospace}
.wpwrap{display:flex}
.incol{display:flex;flex-direction:column;gap:15px}
.grp{position:relative;padding-left:11px;border-left:2px solid var(--hair)}
.glab{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin-bottom:6px}
.gitems{display:flex;flex-direction:column;gap:9px}
.gi{display:flex}
.hubcol{display:flex;align-items:center}
</style>
</head>

var PLAIN={"fo": "Everything the applicant ever sees. Three different surfaces live under here: the public portal, the form engine, and the personal cabinet.","ep": "The public website. No login needed — this is where someone lands from Google or from gov.md before they are anyone in the system.","ep1": "The shop window: the searchable list of all services the state offers. MMIP publishes the permitting ones into it.","ep1a": "One service explained before you commit: what it costs, how long it takes, which documents you need, who issues it. This is where a person decides whether to apply at all.","ep2": "The public register of permits, open to anyone without login. Journalists, lawyers and companies use it to check whether a permit is real and still valid.","ep2s": "How the public finds a specific permit — by number, company code, category, authority or date.","ep2a": "The public view of one permit. Company data is shown fully; personal data of individuals is masked, because this page is open to the whole internet.","ep2b": "A PDF proving the record exists, with a QR code so the reader can verify it is genuine.","ep2c": "A PDF of the permitting document itself, rendered from the register data.","ep4": "Static informational pages — news, FAQ, who to contact. Not part of any request flow.","ig": "The doorway between anonymous browsing and being a known user. Shared by all state services, not built by MMIP.","ig1": "The national login. The user proves identity once and can then use any state service without logging in again.","ig2": "After login: 'who am I acting for right now?' Lists the companies or people who have legally empowered this user to act on their behalf.","f2": "The engine that turns a service configuration into a real, fillable form on screen. It does not know about permits specifically — it renders whatever schema it is given.","l1": "Ask to extend a permit that is about to expire, instead of applying from scratch.","l2": "Ask to change the content of a       if(node.children&&open){
        if(node.seq){
          /* sequence: parent connects to step 1 only, then step N → step N+1 vertically */
          out.push([node.id,node.children[0].id,'']);
          for(var k=0;k<node.children.length-1;k++){
            out.push([node.children[k].id,node.children[k+1].id,'seq']);
          }
          node.children.forEach(function(c){walk(c);});
        } else {
          node.children.forEach(function(c){out.push([node.id,c.id,'']);walk(c);});
        }
      }
    }
    if(cur.kind==='roles'){ walk(wpRoot); }
    else if(cur.kind==='converge'){
      cur.groups.forEach(function(gr){gr.items.forEach(function(it){out.push([it.id,cur.hub.id,'dash']);});});
      walk(cur.hub);
    } else { walk(cur.root); }
    return out;
  },[view,expanded]);

  function compute(){
    var cv=canvasRef.current;if(!cv)return;
    var cr=cv.getBoundingClientRect(),sc=scaleRef.current||1,list=[];
    for(var i=0;i<pairs.length;i++){
      var p=pairs[i],pe=nodeEls.current[p[0]],ce=nodeEls.current[p[1]];if(!pe||!ce)continue;
      var a=pe.getBoundingClientRect(),b=ce.getBoundingClientRect(),d,x1,y1,x2,y2,mx,my;
      if(p[2]==='seq'){
        x1=(a.left-cr.left)/sc+22; y1=(a.bottom-cr.top)/sc;
        x2=(b.left-cr.left)/sc+22; y2=(b.top-cr.top)/sc;
        my=y1+(y2-y1)/2;
        d='M '+x1+' '+y1+' C '+x1+' '+my+', '+x2+' '+my+', '+x2+' '+y2;
      } else {
        x1=(a.right-cr.left)/sc; y1=(a.top+a.height/2-cr.top)/sc;
        x2=(b.left-cr.left)/sc;  y2=(b.top+b.height/2-cr.top)/sc; mx=x1+(x2-x1)/2;
        d='M '+x1+' '+y1+' C '+mx+' '+y1+', '+mx+' '+y2+', '+x2+' '+y2;
      }
      list.push({key:p[0]+'>'+p[1],dash:p[2]==='dash',seq:p[2]==='seq',d:d});
    }
    setPaths(list);setDims({w:cv.offsetWidth,h:cv.offsetHeight});
  }
  useLayoutEffect(compute,[pairs,scale,tick,view]);
  useEffect(function(){
    function onR(){setTick(function(t){return t+1;});}
    window.addEventListener('resize',onR);var ro=null;
    if(typeof ResizeObserver!=='undefined'&&canvasRef.current){ro=new ResizeObserver(onR);ro.observe(canvasRef.current);}
    return function(){window.removeEventListener('resize',onR);if(ro)ro.disconnect();};
  },[view]);

  function setAll(val){
    var e={};
    if(cur.kind==='roles'){allIds(wpRoot).forEach(function(id){e[id]=val;});}
    else if(cur.kind==='converge'){allIds(cur.hub).forEach(function(id){e[id]=val;});}
    else {allIds(cur.root).forEach(function(id){e[id]=val;});}
    setExpanded(e);
  }
  function zoom(d){setScale(function(s){return Math.min(1.6,Math.max(.5,Math.round((s+d)*10)/10));});}

  return h('div',{style:{height:'100%',display:'flex',flexDirection:'column'}},
    h('div',{className:'hd'},
      h('div',{className:'hd-top'},
        h('div',{className:'hd-title'},'GEAP · Sitemap'),
        h('div',{className:'hd-sub'},'aligned to Sitemap v0.1 · Front-Office & Back-Office')
      ),
      h('div',{className:'hd-row'},
        h('div',{className:'seg'},Object.keys(VIEWS).map(function(k){
          return h('button',{key:k,className:view===k?'on':'',onClick:function(){setView(k);}},VIEWS[k].label);
        })),
        h('div',{className:'spacer'}),
        h('div',{className:'tools'},
          h('button',{className:'tbtn'+(showPlain?' on':''),onClick:function(){setShowPlain(!showPlain);},title:'Show plain-language explanation of what actually happens'},'Explanations'),
          h('button',{className:'tbtn'+(showFlags?' on':''),onClick:function(){setShowFlags(!showFlags);},title:'Highlight conflicts and open decisions'},'⚠ Conflicts'),
          h('button',{className:'tbtn',onClick:function(){setAll(true);}},'Expand all'),
          h('button',{className:'tbtn',onClick:function(){setAll(false);}},'Collapse all'),
          h('div',{className:'zoom'},
            h('button',{onClick:function(){zoom(-.1);}},'−'),
            h('div',{className:'zval'},Math.round(scale*100)+'%'),
            h('button',{onClick:function(){zoom(.1);}},'+'),
            h('button',{onClick:function(){setScale(1);},style:{fontSize:'12px'}},'⟳')
          )
        )
      ),
      h('div',{className:'legend'},
        [['t-evo','Evo / cabinet'],['t-sur','Compartment'],['t-pg','Page'],['t-act','Action'],['t-cfg','Settings'],['t-int','M-service'],['t-opn','Removed / conflict']].map(function(x){
          var vars={'t-evo':['--evo-bg','--evo-bd'],'t-sur':['--sur-bg','--sur-bd'],'t-pg':['--pg-bg','--pg-bd'],'t-act':['--act-bg','--act-bd'],'t-cfg':['--cfg-bg','--cfg-bd'],'t-int':['--int-bg','--int-bd'],'t-opn':['--opn-bg','--opn-bd']};
          var vv=vars[x[0]];
          return h('span',{key:x[0],className:'lg'},h('span',{className:'sw',style:{background:'var('+vv[0]+')',borderColor:'var('+vv[1]+')'}}),x[1]);
        }),
        h('span',{className:'lgsep',key:'s1'}),
        h('span',{className:'lg',key:'oM'},h('span',{className:'own own-M'},'M'),'MMIP-owned'),
        h('span',{className:'lg',key:'oS'},h('span',{className:'own own-S'},'S'),'Shared surface'),
        h('span',{className:'lgsep',key:'s2'}),
        h('span',{className:'lg',key:'sfl',style:{gap:'6px'}},
          'Surface:',
          ['EVO','CAB','FOD','BO'].map(function(k){
            return h('span',{key:k,className:'sfbtn sf-'+k+(focus&&focus!==k?' off':''),
              title:SURF[k].t,
              onClick:function(){setFocus(focus===k?null:k);}},SURF[k].s);
          }),
          focus?h('span',{className:'sfbtn',style:{background:'#fff',borderColor:'var(--line)',color:'var(--mut)'},
            onClick:function(){setFocus(null);}},'Show all'):null
        )
      )
    ),
    h('div',{className:'hint'},'Purple chained arrows = a sequence the user walks through in order. Plain fan-out = contained parts, no order. Dashed = different entry points into the same shared workflow.'),
    h('div',{className:'viewport'},
      h('div',{className:'stage',style:{transform:'scale('+scale+')'}},
        h('div',{className:'canvas',ref:canvasRef},
          h('svg',{className:'links',width:dims.w,height:dims.h,viewBox:'0 0 '+dims.w+' '+dims.h},
            [h('defs',{key:'d'},h('marker',{id:'arw',viewBox:'0 0 10 10',refX:8,refY:5,markerWidth:5,markerHeight:5,orient:'auto-start-reverse'},
              h('path',{d:'M 0 0 L 10 5 L 0 10 z',fill:'#7c5cdf'}))),
            paths.map(function(p){return h('path',{key:p.key,className:p.dash?'dash':(p.seq?'seq':''),
              markerEnd:p.seq?'url(#arw)':undefined,d:p.d});})]
          ),
          cur.kind==='roles'
            ? h('div',null,
                h('div',{className:'roleswitch'},
                  ROLES.map(function(r){
                    return h('div',{key:r.id,className:'rchip'+(role===r.id?' on':''),onClick:function(){setRole(r.id);}},
                      h('div',{className:'rlab'},r.label),
                      h('div',{className:'rsc'},r.scope));
                  })
                ),
                h('div',{className:'wpwrap'},
                  h(Tree,{node:wpRoot,root:true,expanded:expanded,register:register,toggle:toggle,showFlags:showFlags,focus:focus,showPlain:showPlain})
                )
              )
            : cur.kind==='converge'
            ? h('div',{className:'conv'},
                h('div',{className:'incol'},cur.groups.map(function(gr){
                  return h('div',{className:'grp',key:gr.g},
                    h('div',{className:'glab'},gr.g),
                    h('div',{className:'gitems'},gr.items.map(function(it){
                      return h('div',{className:'gi',key:it.id},
                        h(Chip,{node:it,isOpen:true,showFlags:showFlags,focus:focus,showPlain:showPlain,reg:function(el){register(it.id,el);},onToggle:function(){}}));
                    }))
                  );
                })),
                h('div',{className:'hubcol'},
                  h(Tree,{node:cur.hub,root:true,expanded:expanded,register:register,toggle:toggle,showFlags:showFlags,focus:focus,showPlain:showPlain})
                )
              )
            : h(Tree,{node:cur.root,root:true,expanded:expanded,register:register,toggle:toggle,showFlags:showFlags,focus:focus,showPlain:showPlain})
        )
      )
    )
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
